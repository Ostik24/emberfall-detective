[project]
name = "emberfall-detective"
version = "0.1.0"
description = "Tip-of-the-tongue movie search agent on top of the Emberfall catalog (UCU NLP Assignment 1)."
requires-python = ">=3.11"
# Lower bounds, not exact pins: Colab preinstalls numpy/pandas and an exact pin would force a
# reinstall there. Exact local versions live in uv.lock.
# numpy 2.5 dropped Python 3.11, so the resolver stays on 2.4.x for 3.11.
dependencies = [
    "anthropic>=2.8.0",
    "httpx>=0.28.1",
    "mcp==2.3.0",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "rapidfuzz==3.14.6",
    "sentence-transformers==5.7.0",
    "snowballstemmer==3.1.1",
    "torch==2.14.1",
    "transformers==5.22.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
notebook = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["concierge", "evals"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The Colab experiment notebooks are attached as run (brief section 9): never reformat them.
# The presentation notebook is generated by notebooks/build_notebook.py (lint that instead).
extend-exclude = ["notebooks/experiments", "notebooks/Emberfall_Detective.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Cell sources are notebook content in strings; their line length is the notebook's layout.
"notebooks/build_notebook.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
